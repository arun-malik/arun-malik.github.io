<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#0f172a"/>
<!-- sandbox: dashed boundary around the agent -->
<rect x="110" y="150" width="280" height="240" rx="18" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="12 10"/>
<g transform="translate(250,270)">
  <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <circle r="14" fill="#fbbf24"/>
</g>
<!-- request leaving the sandbox -->
<line x1="390" y1="270" x2="530" y2="270" stroke="#e2e8f0" stroke-width="3"/>
<path d="M522,260 L540,270 L522,280 Z" fill="#e2e8f0"/>
<!-- broker gate: shield with check -->
<g transform="translate(600,270)">
  <path d="M0,-70 L56,-48 L56,6 C56,44 30,66 0,80 C-30,66 -56,44 -56,6 L-56,-48 Z" fill="none" stroke="#6ee7b7" stroke-width="3"/>
  <path d="M-22,4 L-6,22 L26,-16" fill="none" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- approved path to lab -->
<path d="M660,240 C740,200 790,180 860,180" fill="none" stroke="#6ee7b7" stroke-width="3"/>
<path d="M852,170 L870,180 L852,190 Z" fill="#6ee7b7"/>
<rect x="880" y="140" width="210" height="80" rx="12" fill="#1e293b" stroke="#6ee7b7" stroke-width="2"/>
<text x="985" y="188" text-anchor="middle" fill="#f1f5f9" font-family="monospace" font-size="22">lab/worker</text>
<!-- denied path to prod -->
<path d="M660,300 C740,340 790,360 860,360" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="880" y="320" width="210" height="80" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<text x="985" y="368" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="22">prod/worker</text>
<g transform="translate(770,348)" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round">
  <line x1="-14" y1="-14" x2="14" y2="14"/><line x1="14" y1="-14" x2="-14" y2="14"/>
</g>
<text x="600" y="520" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="34">What a sandbox does not solve for an AI agent</text>
<text x="600" y="565" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="22">Isolation, identity, and approval are separate controls.</text>
</svg>
